<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="460" height="460" x="26" y="26" rx="100" fill="url(#grad1)" filter="url(#shadow)" />
  
  <!-- Stylized Checkmark/Graduation Cap combo -->
  <path d="M160 260 L230 330 L360 180" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Additional stylish accent -->
  <circle cx="230" cy="330" r="12" fill="#f472b6" />
  
  <!-- Outer glowing ring border -->
  <rect width="448" height="448" x="32" y="32" rx="94" fill="none" stroke="url(#grad2)" stroke-opacity="0.25" stroke-width="8" />
</svg>
